<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5 shadow-lg">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">Restablecer contraseña</h3>
                    <form (ngSubmit)="onSubmit()">
                        <div class="form-group mb-3">
                            <label for="newPassword" class="form-label">Nueva contraseña</label>
                            <input type="password" class="form-control" id="newPassword" [(ngModel)]="nuevaContrasena" name="newPassword" required />
                        </div>
                        <div class="form-group mb-4">
                            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="confirmPassword" [(ngModel)]="confirmacionContrasena" name="confirmPassword" required />
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg btn-block">Restablecer contraseña</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
